<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daz Games Community Soundboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Daz Games Soundboard</h1>
        <p>A fan project by rdmilkshakelab</p>
    </header>

    <main class="sound-grid">
        <!-- Sound Button 1 -->
        <button class="sound-btn" data-sound="linda.mp3">
            <span class="emoji">🗣️</span>
            <span class="label">LINDA!</span>
        </button>

        <!-- Sound Button 2 -->
        <button class="sound-btn" data-sound="ha.mp3">
            <span class="emoji">🎩</span>
            <span class="label">ha.</span>
        </button>
    </main>

    <!-- Single Audio Element for JS to control -->
    <audio id="audio-player"></audio>

    <script src="script.js"></script>
</body>
</html>
