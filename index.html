<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daz & Will: Off The Hook Fan Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Neon Header -->
    <header class="neon-header">
        <div class="logo-container">
            <h1>DAZ & WILL</h1>
            <h2>OFF THE HOOK FAN HUB</h2>
        </div>
        <p class="credit">Developed as an experiment by rdmilkshakelab</p>
    </header>

    <div class="dashboard-grid">
        
        <!-- PANEL 1: The Soundboard Grid -->
        <section class="panel soundboard-panel">
            <h3>⚡ MEME SOUNDBOARD</h3>
            <div class="sound-grid">
                <button class="sound-btn" data-sound="linda.mp3">🗣️ LINDA!</button>
                <button class="sound-btn" data-sound="ha.mp3">🎩 ha. (Hat Raise)</button>
                <button class="sound-btn" data-sound="box.mp3">📦 Pass me the box</button>
            </div>
        </section>

        <!-- PANEL 2: Live YouTube API Video Feed -->
        <section class="panel youtube-panel">
            <h3>📺 LATEST VIDEOS</h3>
            <div id="video-container" class="video-feed">
                <p class="loading">Fetching latest uploads from YouTube...</p>
            </div>
        </section>

        <!-- PANEL 3: Live Social Updates Feed -->
        <section class="panel social-panel">
            <h3>📱 SOCIAL UPDATES</h3>
            <div id="social-container" class="social-feed">
                <p class="loading">Connecting to social feeds...</p>
            </div>
        </section>

        <!-- PANEL 4: Off The Hook Mini-Game -->
<section class="panel game-panel">
    <h3>🎣 OFF THE HOOK ACADEMY</h3>
    <div id="game-box">
        <p id="game-status">Ready to catch some massive fish?</p>
        <div id="fishing-bar-container" style="display: none;">
            <div id="fish-progress"></div>
        </div>
        <button id="cast-btn">CAST LINE</button>
    </div>
</section>


    </div>

    <!-- Hidden audio element for soundboard logic -->
    <audio id="global-player"></audio>

    <script src="app.js"></script>
</body>
</html>
